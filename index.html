<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:;base64,=" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Ramp</title>
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
  </head>
  <body>
    <calcite-shell content-behind>
      <calcite-navigation slot="header">
        <calcite-navigation-logo id="header-title" slot="logo" heading="Color Ramp Generator">
          <!-- Dynamically populated -->
        </calcite-navigation-logo>
      </calcite-navigation>

      <calcite-shell-panel id="shell-panel-nav" slot="panel-start" height="l">
        <calcite-panel heading="Color Ramp Adjuster" icon="color-coded-map" display="float" id="app-heading">

          <calcite-action-bar slot="action-bar" layout="horizontal" expand-disabled>
            <calcite-action data-action-id="field" icon="list-radio" text="field" text-enabled></calcite-action>
            <calcite-action data-action-id="basemaps" icon="basemap" text="Basemap" text-enabled></calcite-action>
            <!-- <calcite-action data-action-id="legend" icon="legend" text="Legend" text-enabled></calcite-action> -->
            <calcite-action data-action-id="ramp" icon="color-correction" text="Color Ramp" text-enabled></calcite-action>
          </calcite-action-bar>

          <calcite-block heading="Field" scale="l" data-block-id="field" id="field-block" hidden>
            <calcite-input placeholder="AGOL item ID" id="input"></calcite-input>
            <calcite-label><!-- empty label for spacing --></calcite-label>
            <calcite-autocomplete name="layers" placeholder="" id="layer-selector"></calcite-autocomplete>
            <calcite-label><!-- empty label for spacing --></calcite-label>
            <calcite-label id="fields-label"></calcite-label>
            <calcite-button id="generate-btn" width="full">Generate Histogram</calcite-button>
          </calcite-block>
          
          <calcite-block heading="Basemaps" scale="l" data-block-id="basemaps" hidden>
            <arcgis-basemap-gallery></arcgis-basemap-gallery>
          </calcite-block>
          

          <calcite-block heading="Color Ramp Information" scale="l" data-block-id="ramp" id="ramp-block" hidden>
            <div style="display:flex; flex-direction:column;gap:10px;align-items:center;justify-content:center;">
              <div id="description"></div>
              <calcite-label>Active Color Stop</calcite-label> 
              <calcite-color-picker alpha-channel id="color-picker" format="rgba"></calcite-color-picker>
              <calcite-label></calcite-label> 
              <calcite-button label="Default" slot="content-end" round id="reset-button" width="full" disabled>Default</calcite-button>
              <calcite-button label="Copy JSON" slot="content-end" round id="copy-json" width="full" disabled>Copy JSON</calcite-button>
            </div>
          </calcite-block> 
        
        </calcite-panel>
      </calcite-shell-panel>
      
      <div class="map-frame" id="main-map"></div>
      <calcite-shell-panel resizable slot="panel-bottom" id="bottom-panel" hidden height="l">
        <calcite-panel id="test-panel">
            <div style="display:flex;flex-direction:column">

              <arcgis-slider id="color-slider" value-labels-display="always" range-labels-placement="center" layout="horizontal">
                <arcgis-histogram id="histogram" slot="content-start" color-blending-enabled style="width:100%;max-width:100%;box-sizing:border-box;" layout="horizontal"></arcgis-histogram>
                <div id="color-swatch" slot="content-end" ></div>
              </arcgis-slider>  
            </div>
        </div> 
    </calcite-panel>
  </calcite-shell-panel>
</calcite-shell>

<script type="module" src="/main.js"></script>
</body>
</html>
