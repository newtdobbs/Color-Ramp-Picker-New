<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:;base64,=" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Ramp</title>
    <script type="module" src="https://js.arcgis.com/5.0/"></script>

  </head>
  <body>
    <calcite-shell content-behind>
      <calcite-navigation slot="header">
        <calcite-navigation-logo id="header-title" slot="logo" heading="Color Ramp Generator">
          <!-- Dynamically populated -->
        </calcite-navigation-logo>
      </calcite-navigation>



      <calcite-shell-panel id="shell-panel-nav" slot="panel-start" height="l">
        <calcite-panel heading="Color Ramp Adjuster" icon="color-correction" id="app-heading">

          <calcite-action-bar slot="action-bar" layout="horizontal" expand-disabled>
            <calcite-action data-action-id="layers" icon="layers" text="Layers" text-enabled></calcite-action>
            <calcite-action data-action-id="basemaps" icon="basemap" text="Basemaps" text-enabled></calcite-action>
            <calcite-action data-action-id="legend" icon="legend" text="Legend" text-enabled></calcite-action>
          </calcite-action-bar>
          <calcite-block heading="Layers" scale="l" data-block-id="layers" id="layers-block" hidden>
            <calcite-input placeholder="AGOL item ID" id="input"></calcite-input>
            <calcite-label><!-- empty label for spacing --></calcite-label>
            <calcite-autocomplete name="layers" placeholder="" id="layer-selector"></calcite-autocomplete>
            <calcite-label><!-- empty label for spacing --></calcite-label>
            <calcite-label id="fields-label"></calcite-label>
            <calcite-button id="generate-btn" width="full">Generate Histogram</calcite-button>
          </calcite-block>

         <calcite-block heading="Basemaps" scale="l" data-block-id="basemaps" hidden>
          <arcgis-basemap-gallery></arcgis-basemap-gallery>
        </calcite-block>
     
        <calcite-block heading="Legend" scale="l" data-block-id="legend" hidden>
          <arcgis-legend legend-style="classic" reference-element="main-map"></arcgis-legend>
        </calcite-block> 


      </calcite-shell-panel>
      
      <div class="map-frame" id="main-map"></div>
      <calcite-shell-panel resizable slot="panel-bottom" id="bottom-panel" hidden height="l">
        <div style="display:flex;gap:2%;width:100%;height:100%;align-content:center;justify-content:center;align-items:center;">
          <arcgis-slider id="color-slider" value-labels-display="always" range-labels-placement="center" layout="horizontal">
            <!-- Histogram above -->
            <arcgis-histogram
              id="histogram"
              slot="content-start"
              color-blending-enabled
              style="width:100%;max-width:100%;box-sizing:border-box;"
              layout="horizontal"
            ></arcgis-histogram>
  
            <div id="color-swatch" slot="content-end" ></div>
          </arcgis-slider>
          
          <!-- For now, I'll put this switch INSIDE the div next to the histogram -->
          <div id="right-buttons-panel">
            <!-- SWITCH FOR COLOR CHANGE BEHAVIOR -->
            <!-- <calcite-label>Active Color Stop
              <calcite-swatch value="color-1" label="Active Color Stop" color="#ffffff" id="color-swatch" scale="l"></calcite-swatch>
            </calcite-label>  -->
            <calcite-label>Active Color Stop</calcite-label> 
            <calcite-color-picker alpha-channel id="color-picker" format="rgba"></calcite-color-picker>
            <calcite-label>Color Change Behavior</calcite-label> 
            <calcite-label layout="inline" slot="footer-end"> 
              Static
              <!-- adding a switch with a default value of "discrete" -->
              <calcite-switch disabled id="update-switch" value="static"></calcite-switch>
              Responsive
            </calcite-label>
            
            <!-- BUTTON FOR SMART MAPPING DEFAULTS -->
            <calcite-button
              label="Default"
              width="full"
              round
              id="reset-button"
              disabled
              >
              Default
            </calcite-button>
            <calcite-label> <!-- EMPTY LABEL FOR SPACING --> </calcite-label>
            <calcite-button
              label="Default"
              width="full"
              round
              id="copy-json"
              disabled
              >
              Copy JSON
            </calcite-button>
  
          </div>
        </div>
        <div id="dialog-description" slot="footer"></div>
      </calcite-shell-panel>
    </calcite-shell>
 
    <script type="module" src="/main.js"></script>
  </body>
</html>
