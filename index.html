<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:;base64,=" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Ramp</title>
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
  </head>
  <body>
    <calcite-shell content-behind>
      <calcite-navigation slot="header">
        <calcite-navigation-logo id="header-title" slot="logo" heading="Color Ramp Generator">
          <!-- Dynamically populated -->
        </calcite-navigation-logo>
      </calcite-navigation>

      <calcite-shell-panel id="shell-panel-nav" slot="panel-start" height="l">
        <calcite-panel heading="Color Ramp Adjuster" icon="color-coded-map" display="float" id="inner-panel">

          <calcite-action-bar slot="action-bar" layout="horizontal" expand-disabled id="action-bar">
            <calcite-action data-action-id="field" icon="list-radio" text="Field" active text-enabled></calcite-action>
            <calcite-action data-action-id="basemaps" icon="basemap" text="Basemap" text-enabled></calcite-action>
            <calcite-action data-action-id="color" icon="color-correction" text="Color" disabled text-enabled></calcite-action>
          </calcite-action-bar>

          <calcite-block heading="Layer:" data-block-id="field" expanded id="field-block">
            <calcite-input placeholder="AGOL item ID" id="input"></calcite-input>
            <calcite-label><!-- empty label for spacing --></calcite-label>
            <calcite-autocomplete name="layers" placeholder="" id="layer-selector"></calcite-autocomplete>
            <calcite-label><!-- empty label for spacing --></calcite-label>
            <calcite-label id="fields-label"></calcite-label>
            <calcite-button id="generate-btn" width="full">Generate Histogram</calcite-button>
          </calcite-block>
          
          <calcite-block heading="Basemaps" data-block-id="basemaps" hidden>
            <arcgis-basemap-gallery width="full"></arcgis-basemap-gallery>
          </calcite-block>
          

          <calcite-block heading="Color Information" scale="l" data-block-id="color" id="ramp-block" hidden>
            <div style="display:flex; flex-direction:column;gap:10px;align-items:center;justify-content:center;">
              <div id="description"></div>
              <!-- <calcite-label>Active Color Stop</calcite-label>  -->
              <calcite-fab id="previous-color-button" disabled label="Undo Change" text-enabled text="Undo Change" icon="undo"></calcite-fab>
              <calcite-color-picker alpha-channel id="color-picker" format="rgba"></calcite-color-picker>
              <calcite-label></calcite-label> 
              <calcite-split-button width="full" round primary-text="Apply to Slider Stop" id="apply-button">
                  <calcite-dropdown-group id="slider-stop-dropdown" selection-mode="single" group-title="Slider Stop">
                  </calcite-dropdown-group>
              </calcite-split-button>
              <calcite-button label="Default" id="reset-button" width="full" disabled>Default</calcite-button>
              <calcite-button label="Copy JSON" id="copy-json" width="full" disabled>Copy JSON</calcite-button>
            </div>
          </calcite-block> 
        
        </calcite-panel>
      </calcite-shell-panel>
      
      <div class="map-frame" id="main-map"></div>
      <calcite-shell-panel resizable slot="panel-bottom" id="bottom-shell" hidden height="l">
        <!-- <calcite-loader id="bottom-loader"></calcite-loader> -->
        <calcite-panel id="bottom-panel">
          <arcgis-slider id="color-slider" value-labels-display="always" range-labels-placement="center" layout="horizontal">
            <arcgis-histogram id="histogram" slot="content-start" color-blending-enabled style="width:100%;max-width:100%;box-sizing:border-box;" layout="horizontal"></arcgis-histogram>
            <div id="color-swatch" slot="content-end" ></div>
          </arcgis-slider>  
    </calcite-panel>
  </calcite-shell-panel>
</calcite-shell>

<script type="module" src="/main.js"></script>
</body>
</html>
